<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>看護教育におけるAI理解力と生成AI活用の要請</title>
  <style>
    html, body { margin: 0; min-height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f6f2ea; color: #14191d; }
    .loading { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .loading p { margin: 0.35rem 0; }
    .loading a { color: #1b4d5b; }
  </style>
</head>
<body>
  <main id="loading" class="loading">
    <div>
      <p>ページを読み込んでいます。</p>
      <p>しばらくお待ちください。</p>
    </div>
  </main>
  <script>
    (async () => {
      const source = "https://files.catbox.moe/36651d.html";
      const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(source);
      try {
        const response = await fetch(proxy, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById("loading").innerHTML = '<div><p>ページを読み込めませんでした。</p><p><a href="' + source + '">元ファイルを開く</a></p></div>';
        console.error(error);
      }
    })();
  </script>
  <noscript>
    <main class="loading">
      <div>
        <p>JavaScriptを有効にして開いてください。</p>
        <p><a href="https://files.catbox.moe/36651d.html">元ファイルを開く</a></p>
      </div>
    </main>
  </noscript>
</body>
</html>
